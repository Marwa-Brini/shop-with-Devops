<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Luxe Shop</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav>
  <a href="/" class="logo">LUXE</a>
  <div class="nav-links">
    <a href="/">Shop</a>
    <a href="/cart" class="cart-btn">
      🛒 Cart <span id="cart-count">0</span>
    </a>
  </div>
</nav>

<div class="page-container">
  <h1 class="page-title">Checkout</h1>
  <div id="checkout-content">

    <div class="checkout-form" id="checkout-form-section">
      <div class="form-group">
        <label>FULL NAME</label>
        <input type="text" id="name" placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label>EMAIL</label>
        <input type="email" id="email" placeholder="john@example.com" />
      </div>
      <div class="form-group">
        <label>DELIVERY ADDRESS</label>
        <textarea id="address" placeholder="123 Main St, City, Country"></textarea>
      </div>
      <div id="checkout-summary" style="margin: 1rem 0; color: var(--text-dim); font-size:0.95rem;"></div>
      <div style="display:flex; gap: 1rem; flex-wrap: wrap;">
        <button class="btn-primary" onclick="placeOrder()">Place Order</button>
        <a href="/cart" class="btn-secondary">Back to Cart</a>
      </div>
      <p id="checkout-error" style="color:var(--danger); font-size:0.9rem; display:none;"></p>
    </div>

    <div id="order-result" style="display:none;"></div>
  </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/checkout.js"></script>
</body>
</html>
