name: Full DevOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/shop-app

jobs:

  # ─────────────────────────────────────────
  # JOB 1: Test
  # ─────────────────────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: shop
        run: npm install

      - name: Run tests
        working-directory: shop
        run: npm test --if-present

  # ─────────────────────────────────────────
  # JOB 2: Terraform - Provision AWS infra
  # ─────────────────────────────────────────
  terraform:
    name: 🏗️ Terraform - Provision Infrastructure
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: shop/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: shop/terraform
        run: |
          terraform plan \
            -var="key_name=${{ secrets.AWS_KEY_NAME }}" \
            -var="key_path=~/.ssh/id_rsa" \
            -var="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: shop/terraform
        run: |
          terraform apply -auto-approve \
            -var="key_name=${{ secrets.AWS_KEY_NAME }}" \
            -var="key_path=~/.ssh/id_rsa" \
            -var="region=${{ secrets.AWS_REGION }}"

  # ─────────────────────────────────────────
  # JOB 3: Build & Push Docker image
  # ─────────────────────────────────────────
  docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./shop
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  # ─────────────────────────────────────────
  # JOB 4: Ansible - Configure & Deploy
  # ─────────────────────────────────────────
  ansible:
    name: ⚙️ Ansible - Configure Server & Deploy
    runs-on: ubuntu-latest
    needs: [terraform, docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Create inventory file
        run: |
          echo "[web]" > shop/ansible/inventory/hosts.ini
          echo "${{ secrets.EC2_HOST }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa" >> shop/ansible/inventory/hosts.ini

      - name: Run Ansible Playbook
        run: |
          ansible-playbook \
            -i shop/ansible/inventory/hosts.ini \
            shop/ansible/playbook.yml \
            --extra-vars "docker_image=${{ env.DOCKER_IMAGE }}:latest"

  # ─────────────────────────────────────────
  # JOB 5: Verify Deployment
  # ─────────────────────────────────────────
  verify:
    name: ✅ Verify Deployment
    runs-on: ubuntu-latest
    needs: ansible
    steps:
      - name: Check app is running
        run: |
          sleep 15
          curl -f http://${{ secrets.EC2_HOST }}:3000 || exit 1
          echo "✅ Shop is live at http://${{ secrets.EC2_HOST }}:3000"
